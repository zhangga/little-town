# 本地开发用 MySQL 8.4 LTS（应用兼容 MySQL 8.0+）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据重来：docker compose down -v
#
# 启动后无需手动建表——后端首次运行会通过 GORM AutoMigrate 自动建表。
# 这个文件只负责把「库」准备好。

services:
  mysql:
    image: mysql:8.4
    container_name: little-town-mysql
    restart: unless-stopped
    environment:
      MYSQL_USER: littletown
      MYSQL_PASSWORD: littletown_dev_pw
      MYSQL_ROOT_PASSWORD: littletown_root_dev_pw
      MYSQL_DATABASE: littletown_db
      TZ: Asia/Shanghai
    ports:
      # 只监听本机，避免局域网内其他机器连上开发库
      - "127.0.0.1:3306:3306"
    volumes:
      - little-town-mysqldata:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+08:00"]
    healthcheck:
      # 后端启动依赖这个检查，避免「容器起来了但数据库还没就绪」
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # 可选：浏览器里查看数据，访问 http://localhost:8081
  # 不需要就直接删掉这段
  adminer:
    image: adminer:latest
    container_name: little-town-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  little-town-mysqldata:
